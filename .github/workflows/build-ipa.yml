name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - phase1-ci-ipa
      - temp-ci-verify-1795239586

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: build-ondevicelas-unsigned-ipa
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Initialize only llama.cpp submodule at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- ThirdParty/llama.cpp

          expected_llama_commit="7ef790f90a4772eadd6966815f6d3ae7d93c7e03"
          actual_llama_commit="$(git -C "${GITHUB_WORKSPACE}/ThirdParty/llama.cpp" rev-parse HEAD)"
          echo "ThirdParty/llama.cpp HEAD: ${actual_llama_commit}"
          if [[ "${actual_llama_commit}" != "${expected_llama_commit}" ]]; then
            echo "error: unexpected llama.cpp commit ${actual_llama_commit} (expected ${expected_llama_commit})" >&2
            exit 1
          fi

          if [[ -f "${GITHUB_WORKSPACE}/ThirdParty/whisper.cpp/CMakeLists.txt" ]]; then
            echo "error: ThirdParty/whisper.cpp must remain uninitialized for OnDeviceLAS" >&2
            exit 1
          fi

      - name: Verify Xcode 26, iOS SDK, Metal Toolchain, and build tools
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          sysctl hw.ncpu hw.memsize
          df -h
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

          # `xcrun -f metal` can succeed on Xcode's stub binary even when the
          # optional Metal Toolchain component is not installed; verify with
          # `metal --version` and a real `.metal` -> `.air` compilation check.
          if ! xcrun --sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "iOS Metal Toolchain is missing; downloading metalToolchain..."
            xcodebuild -downloadComponent metalToolchain
          fi

          xcrun --sdk iphoneos metal --version

          metal_probe_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/metal-probe.XXXXXX")"
          trap 'rm -rf "${metal_probe_dir}"' EXIT
          cat > "${metal_probe_dir}/probe.metal" <<'METAL'
          #include <metal_stdlib>
          using namespace metal;
          kernel void ci_probe() {}
          METAL

          if ! xcrun --sdk iphoneos metal -c "${metal_probe_dir}/probe.metal" -o "${metal_probe_dir}/probe.air"; then
            echo "error: failed to compile minimal iOS Metal shader with xcrun --sdk iphoneos metal" >&2
            xcodebuild -showComponent metalToolchain >/dev/null 2>&1 || true
            exit 1
          fi
          if [[ ! -s "${metal_probe_dir}/probe.air" ]]; then
            echo "error: compiled Metal probe output ${metal_probe_dir}/probe.air is missing or empty" >&2
            exit 1
          fi
          echo "Verified iOS Metal shader compilation (${metal_probe_dir}/probe.air)"

          for tool in cmake xcodegen pod; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              case "${tool}" in
                cmake) brew install cmake ;;
                xcodegen) brew install xcodegen ;;
                pod) brew install cocoapods ;;
              esac
            fi
          done
          cmake --version | head -n 1
          xcodegen --version
          pod --version

      - name: Build llama.cpp iOS XCFramework (device + arm64 simulator) and remove intermediates
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_WORKSPACE:-}" || ! -f "${GITHUB_WORKSPACE}/ThirdParty/llama.cpp/build-xcframework.sh" ]]; then
            echo "error: ThirdParty/llama.cpp/build-xcframework.sh is missing" >&2
            exit 1
          fi

          llama_root="${GITHUB_WORKSPACE}/ThirdParty/llama.cpp"
          helper_file="$(mktemp "${RUNNER_TEMP:-/tmp}/llama-xcframework-helpers.XXXXXX")"
          stage_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/llama-xcf-stage.XXXXXX")"
          trap 'rm -rf "${helper_file}" "${stage_root}"' EXIT

          # Source upstream options and packaging helpers from pinned llama.cpp
          # so we build ONLY arm64 Simulator (for OnDeviceLASTests) + arm64 Device
          # sequentially, deleting each CMake build tree immediately to protect SSD space.
          awk '\
            /^IOS_MIN_OS_VERSION=/ { copying = 1 }\
            /^check_required_tool\\(\\)/ && copying { copying = 0 }\
            /^setup_framework_structure\\(\\)/ { copying = 1 }\
            /^# Create dynamic libraries from static libraries\\./ && copying { copying = 0 }\
            /^combine_static_libraries\\(\\)/ { copying = 1 }\
            /^echo "Building for iOS simulator/ && copying { copying = 0 }\
            copying { print }\
          ' "${llama_root}/build-xcframework.sh" > "${helper_file}"

          # Normalize ONLY combine_static_libraries() -> case "$platform" -> "ios") -> is_simulator == "true" inside the temporary helper_file so the Simulator slice links arm64-only (matching CMake),
          # without modifying ThirdParty/llama.cpp/build-xcframework.sh.
          python3 - "${helper_file}" <<'PY'
          import pathlib, re, sys
          helper_path = pathlib.Path(sys.argv[1])
          before = helper_path.read_text(encoding="utf-8")
          func_matches = list(re.finditer(r"^combine_static_libraries\(\)\s*\{", before, flags=re.MULTILINE))
          if len(func_matches) != 1:
              raise SystemExit(f"error: expected 1 combine_static_libraries() definition in {helper_path}, found {len(func_matches)}")
          combine_start = func_matches[0].start()

          target_ios_block = (
              '        "ios")\n'
              '            if [[ "$is_simulator" == "true" ]]; then\n'
              '                sdk="iphonesimulator"\n'
              '                archs="arm64 x86_64"\n'
              '                min_version_flag="-mios-simulator-version-min=${IOS_MIN_OS_VERSION}"\n'
              '            else\n'
              '                sdk="iphoneos"\n'
              '                archs="arm64"\n'
              '                min_version_flag="-mios-version-min=${IOS_MIN_OS_VERSION}"\n'
              '            fi\n'
              '            install_name="@rpath/llama.framework/llama"\n'
              '            ;;\n'
          )
          replacement_ios_block = (
              '        "ios")\n'
              '            if [[ "$is_simulator" == "true" ]]; then\n'
              '                sdk="iphonesimulator"\n'
              '                archs="arm64"\n'
              '                min_version_flag="-mios-simulator-version-min=${IOS_MIN_OS_VERSION}"\n'
              '            else\n'
              '                sdk="iphoneos"\n'
              '                archs="arm64"\n'
              '                min_version_flag="-mios-version-min=${IOS_MIN_OS_VERSION}"\n'
              '            fi\n'
              '            install_name="@rpath/llama.framework/llama"\n'
              '            ;;\n'
          )
          occurrences = before.count(target_ios_block)
          if occurrences != 1:
              raise SystemExit(f"error: expected target iOS simulator/device block once in {helper_path}, found {occurrences}")
          block_offset = before.index(target_ios_block)
          if block_offset <= combine_start:
              raise SystemExit("error: target iOS block is outside combine_static_libraries()")
          patched = before[:block_offset] + replacement_ios_block + before[block_offset + len(target_ios_block):]
          helper_path.write_text(patched, encoding="utf-8")
          after = helper_path.read_text(encoding="utf-8")
          if after.count(replacement_ios_block) != 1 or target_ios_block in after:
              raise SystemExit("error: post-write verification failed for normalized iOS block")
          after_offset = after.index(replacement_ios_block)
          ios_after = after[after_offset:after_offset + len(replacement_ios_block)]
          sim_part, device_part = ios_after.split('            else\n', 1)
          if "x86_64" in sim_part:
              raise SystemExit("error: x86_64 remained in iOS simulator branch")
          if 'sdk="iphonesimulator"' not in sim_part or 'archs="arm64"' not in sim_part:
              raise SystemExit("error: arm64 simulator settings missing after normalization")
          expected_device_part = (
              '                sdk="iphoneos"\n'
              '                archs="arm64"\n'
              '                min_version_flag="-mios-version-min=${IOS_MIN_OS_VERSION}"\n'
              '            fi\n'
              '            install_name="@rpath/llama.framework/llama"\n'
              '            ;;\n'
          )
          if device_part != expected_device_part:
              raise SystemExit("error: iOS device branch was unexpectedly altered")
          unchanged_prefix = before[:block_offset] == after[:after_offset]
          unchanged_suffix = (before[block_offset + len(target_ios_block):] == after[after_offset + len(replacement_ios_block):])
          if not (unchanged_prefix and unchanged_suffix):
              raise SystemExit("error: helper content outside iOS block was unexpectedly modified")
          print("Verified helper_file normalization: combine_static_libraries() iOS simulator archs='arm64' (device branch and all other sections unchanged)")
          PY
          bash -n "${helper_file}"
          git -C "${llama_root}" diff --exit-code -- build-xcframework.sh

          (
            cd "${llama_root}"
            # shellcheck disable=SC1090
            source "${helper_file}"
            if ! declare -F setup_framework_structure >/dev/null ||
               ! declare -F combine_static_libraries >/dev/null; then
              echo "error: failed to load XCFramework packaging helpers from build-xcframework.sh" >&2
              exit 1
            fi

            rm -rf build-apple build-ios-sim build-ios-device

            echo "Building llama.cpp for iOS Simulator (arm64 only, for offline XCTest)..."
            cmake -B build-ios-sim -G Xcode \
              "${COMMON_CMAKE_ARGS[@]}" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_MIN_OS_VERSION}" \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphonesimulator \
              -DCMAKE_OSX_ARCHITECTURES="arm64" \
              -DCMAKE_XCODE_ATTRIBUTE_SUPPORTED_PLATFORMS=iphonesimulator \
              -DCMAKE_C_FLAGS="${COMMON_C_FLAGS}" \
              -DCMAKE_CXX_FLAGS="${COMMON_CXX_FLAGS}" \
              -DLLAMA_OPENSSL=OFF \
              -DMTMD_VIDEO=OFF \
              -S .
            cmake --build build-ios-sim --config Release -j 2 -- -quiet

            setup_framework_structure "build-ios-sim" "${IOS_MIN_OS_VERSION}" "ios"
            combine_static_libraries "build-ios-sim" "Release-iphonesimulator" "ios" "true"
            mkdir -p "${stage_root}/sim/framework"
            mv build-ios-sim/framework "${stage_root}/sim/framework"
            mv build-ios-sim/dSYMs "${stage_root}/sim/dSYMs"
            rm -rf build-ios-sim

            echo "Building llama.cpp for iOS device (arm64 only)..."
            cmake -B build-ios-device -G Xcode \
              "${COMMON_CMAKE_ARGS[@]}" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_MIN_OS_VERSION}" \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES="arm64" \
              -DCMAKE_XCODE_ATTRIBUTE_SUPPORTED_PLATFORMS=iphoneos \
              -DCMAKE_C_FLAGS="${COMMON_C_FLAGS}" \
              -DCMAKE_CXX_FLAGS="${COMMON_CXX_FLAGS}" \
              -DLLAMA_OPENSSL=OFF \
              -DMTMD_VIDEO=OFF \
              -S .
            cmake --build build-ios-device --config Release -j 2 -- -quiet

            setup_framework_structure "build-ios-device" "${IOS_MIN_OS_VERSION}" "ios"
            combine_static_libraries "build-ios-device" "Release-iphoneos" "ios" "false"
            mkdir -p "${stage_root}/device"
            mv build-ios-device/framework "${stage_root}/device/framework"
            mv build-ios-device/dSYMs "${stage_root}/device/dSYMs"
            rm -rf build-ios-device

            mkdir -p build-apple
            xcrun xcodebuild -create-xcframework \
              -framework "${stage_root}/sim/framework/llama.framework" \
              -debug-symbols "${stage_root}/sim/dSYMs/llama.dSYM" \
              -framework "${stage_root}/device/framework/llama.framework" \
              -debug-symbols "${stage_root}/device/dSYMs/llama.dSYM" \
              -output "$(pwd)/build-apple/llama.xcframework"
          )

          xcframework_dir="${llama_root}/build-apple/llama.xcframework"
          if [[ ! -d "${xcframework_dir}" ]]; then
            echo "error: expected XCFramework directory not found at ${xcframework_dir}" >&2
            exit 1
          fi
          ls -la "${xcframework_dir}"

          device_binary="${xcframework_dir}/ios-arm64/llama.framework/llama"
          sim_binary="${xcframework_dir}/ios-arm64-simulator/llama.framework/llama"
          if [[ ! -s "${device_binary}" ]]; then
            echo "error: expected non-empty device framework binary not found at ${device_binary}" >&2
            exit 1
          fi
          if [[ ! -s "${sim_binary}" ]]; then
            echo "error: expected non-empty simulator framework binary not found at ${sim_binary}" >&2
            exit 1
          fi
          ls -lh "${device_binary}" "${sim_binary}"

          device_archs="$(lipo -archs "${device_binary}")"
          sim_archs="$(lipo -archs "${sim_binary}")"
          echo "XCFramework device slice architectures: ${device_archs}"
          echo "XCFramework simulator slice architectures: ${sim_archs}"
          if [[ "${device_archs}" != "arm64" ]]; then
            echo "error: expected arm64-only device framework binary, got '${device_archs}'" >&2
            exit 1
          fi
          if [[ "${sim_archs}" != "arm64" ]]; then
            echo "error: expected arm64-only simulator framework binary, got '${sim_archs}'" >&2
            exit 1
          fi

          rm -rf "${llama_root}/build-ios-sim" "${llama_root}/build-ios-device"
          df -h

      - name: Generate Xcode project and CocoaPods workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          proj_resolved="OnDeviceLAS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          ws_resolved="OnDeviceLAS.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          git ls-files --error-unmatch "${proj_resolved}" "${ws_resolved}" >/dev/null

          xcodegen generate
          pod install

          # Restore Git-tracked SwiftPM lockfiles after xcodegen and CocoaPods regeneration
          git checkout -- "${proj_resolved}" "${ws_resolved}"

          if [[ ! -s "${proj_resolved}" || ! -s "${ws_resolved}" ]]; then
            echo "error: restored SwiftPM Package.resolved file is missing or empty" >&2
            exit 1
          fi
          if ! cmp -s "${proj_resolved}" "${ws_resolved}"; then
            echo "error: restored SwiftPM Package.resolved files differ between project and workspace" >&2
            exit 1
          fi
          echo "Verified restored SwiftPM Package.resolved files match"

      - name: Resolve SwiftPM dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace "${GITHUB_WORKSPACE}/OnDeviceLAS.xcworkspace" \
            -scheme OnDeviceLAS \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${GITHUB_WORKSPACE}/build"
          df -h

      - name: Run unit tests with result bundle
        shell: bash
        env:
          ONDEVICELAS_RUN_LIVE_NETWORK_TESTS: "0"
        run: |
          set -euo pipefail
          sim_udid="$(python3 - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          devices_by_runtime = data.get("devices", {})
          candidates = []
          for runtime in sorted(devices_by_runtime.keys(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for dev in devices_by_runtime.get(runtime, []):
                  if not dev.get("isAvailable"):
                      continue
                  name = dev.get("name", "")
                  udid = dev.get("udid", "")
                  if udid and ("iPad" in name or "iPhone" in name):
                      priority = 0 if "iPad" in name else 1
                      candidates.append((priority, runtime, name, udid))
          if not candidates:
              raise SystemExit("error: no available iOS Simulator device found for OnDeviceLASTests")
          candidates.sort(key=lambda item: (item[0]))
          chosen = candidates[0]
          print(chosen[3])
          PY
          )"
          if [[ -z "${sim_udid}" ]]; then
            echo "error: failed to resolve iOS Simulator UDID" >&2
            exit 1
          fi

          RESULT_BUNDLE="${RUNNER_TEMP}/result-${GITHUB_RUN_ID}.xcresult"
          set +e
          xcodebuild test \
            -workspace "${GITHUB_WORKSPACE}/OnDeviceLAS.xcworkspace" \
            -scheme OnDeviceLAS \
            -destination "platform=iOS Simulator,id=${sim_udid}" \
            -derivedDataPath "${GITHUB_WORKSPACE}/build" \
            -only-testing:OnDeviceLASTests \
            -skip-testing:OnDeviceLASTests/Phase3OptionalLiveNetworkTests \
            -parallel-testing-enabled NO \
            -jobs 2 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -resultBundlePath "$RESULT_BUNDLE"
          TEST_EXIT=$?
          set -e

          # Extract summary (numeric if available)
          METRICS_JSON=$(xcrun xcresulttool get --path "$RESULT_BUNDLE" --format json | jq -r '.metrics')
          if echo "$METRICS_JSON" | grep -q '"testsPassed"'; then
            PASSED=$(echo "$METRICS_JSON" | jq -r '.testsPassed')
            FAILED=$(echo "$METRICS_JSON" | jq -r '.testsFailed')
            SKIPPED=$(echo "$METRICS_JSON" | jq -r '.testsSkipped')
            TOTAL=$(echo "$METRICS_JSON" | jq -r '.testsTotal')
            echo "Test Summary: passed=$PASSED failed=$FAILED skipped=$SKIPPED total=$TOTAL" >"${RUNNER_TEMP}/test_summary.txt"
          else
            # Fallback to original string summary
            SUMMARY=$(echo "$METRICS_JSON" | jq -r '.testResultSummary')
            echo "Test Summary (fallback): $SUMMARY" >"${RUNNER_TEMP}/test_summary.txt"
          fi

          xcrun simctl shutdown all || true
          rm -rf "${GITHUB_WORKSPACE}/build/Build"
          df -h
          exit "$TEST_EXIT"

      - name: Upload test result bundle
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-result-${{ github.run_id }}
          path: ${{ env.RUNNER_TEMP }}/result-${{ github.run_id }}.xcresult

      - name: Upload test summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-summary-${{ github.run_id }}
          path: ${{ env.RUNNER_TEMP }}/test_summary.txt

      - name: Build unsigned Release iOS app (arm64 device slice)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace "${GITHUB_WORKSPACE}/OnDeviceLAS.xcworkspace" \
            -scheme OnDeviceLAS \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath "${GITHUB_WORKSPACE}/build" \
            -jobs 2 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            VALIDATE_PRODUCT=NO

      - name: Verify app bundle metadata, resources, port 11434, ZIP structure, and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_WORKSPACE:-}" || ! -d "${GITHUB_WORKSPACE}" ]]; then
            echo "error: invalid GITHUB_WORKSPACE" >&2
            exit 1
          fi

          app_path="${GITHUB_WORKSPACE}/build/Build/Products/Release-iphoneos/OnDeviceLAS.app"
          if [[ ! -d "${app_path}" ]]; then
            echo "error: built app bundle not found at ${app_path}" >&2
            exit 1
          fi

          # Free compiler intermediates before duplicating Payload/ and zipping IPA on 14 GB SSD
          rm -rf "${GITHUB_WORKSPACE}/build/Build/Intermediates.noindex"

          # 1. Verify Bundle ID and UIDDeviceFamily in Info.plist
          python3 - "${app_path}/Info.plist" "${GITHUB_WORKSPACE}/IOSLocalLLM/Models/AppSettings.swift" "${GITHUB_WORKSPACE}/IOSLocalLLM/ContentView.swift" <<'PY'
          import plistlib, re, sys
          plist_path, settings_path, content_view_path = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(plist_path, "rb") as f:
              info = plistlib.load(f)

          bundle_id = info.get("CFBundleIdentifier")
          device_family = info.get("UIDeviceFamily", [])
          print(f"Verified CFBundleIdentifier: {bundle_id}")
          print(f"Verified UIDDeviceFamily: {device_family}")

          if bundle_id != "com.local.ondevicelas":
              raise SystemExit(f"error: unexpected CFBundleIdentifier {bundle_id!r}")
          if not ({1, 2}.issubset(set(device_family))):
              raise SystemExit(f"error: UIDDeviceFamily {device_family!r} does not include both iPhone (1) and iPad (2)")

          with open(settings_path, "r", encoding="utf-8") as f:
              settings_src = f.read()
          with open(content_view_path, "r", encoding="utf-8") as f:
              view_src = f.read()

          if not re.search(r'@AppStorage\("localAPIPort"\)\s+var\s+localAPIPort:\s*Int\s*=\s*11_?434\b', settings_src):
              raise SystemExit("error: AppSettings.localAPIPort default is not 11434")
          if not re.search(r'@AppStorage\("localAPIPort"\)\s+private\s+var\s+port\s*=\s*11_?434\b', view_src):
              raise SystemExit("error: ContentView localAPIPort default is not 11434")
          print("Verified default API port configuration: 11434")
          PY

          # 2. Verify arm64 Mach-O architecture and unsigned state
          app_archs="$(lipo -archs "${app_path}/OnDeviceLAS")"
          llama_archs="$(lipo -archs "${app_path}/Frameworks/llama.framework/llama")"
          echo "OnDeviceLAS architectures: ${app_archs}"
          echo "llama.framework architectures: ${llama_archs}"
          if [[ "${app_archs}" != "arm64" || "${llama_archs}" != "arm64" ]]; then
            echo "error: expected arm64-only device binaries (got app='${app_archs}', llama='${llama_archs}')" >&2
            exit 1
          fi

          if [[ -e "${app_path}/embedded.mobileprovision" || -d "${app_path}/_CodeSignature" ]]; then
            echo "error: unexpected signing artifacts present in unsigned build" >&2
            exit 1
          fi

          # 3. Package unsigned IPA
          payload_dir="${GITHUB_WORKSPACE}/Payload"
          ipa_path="${GITHUB_WORKSPACE}/OnDeviceLAS-unsigned.ipa"
          rm -rf "${payload_dir}" "${ipa_path}"
          mkdir -p "${payload_dir}"
          cp -RP "${app_path}" "${payload_dir}/OnDeviceLAS.app"
          (
            cd "${GITHUB_WORKSPACE}"
            zip -qryy OnDeviceLAS-unsigned.ipa Payload
          )
          rm -rf "${payload_dir}"

          if [[ ! -s "${ipa_path}" ]]; then
            echo "error: failed to create ${ipa_path}" >&2
            exit 1
          fi

          # 4. Verify ZIP archive integrity and required embedded frameworks/resources
          unzip -tq "${ipa_path}"
          ipa_entries="$(zipinfo -1 "${ipa_path}")"
          for required_entry in \
            "Payload/OnDeviceLAS.app/OnDeviceLAS" \
            "Payload/OnDeviceLAS.app/Info.plist" \
            "Payload/OnDeviceLAS.app/Assets.car" \
            "Payload/OnDeviceLAS.app/PrivacyInfo.xcprivacy" \
            "Payload/OnDeviceLAS.app/Frameworks/llama.framework/llama" \
            "Payload/OnDeviceLAS.app/Frameworks/llama.framework/Info.plist" \
            "Payload/OnDeviceLAS.app/mlx-swift_Cmlx.bundle/default.metallib"; do
            if ! grep -Fxq "${required_entry}" <<<"${ipa_entries}"; then
              echo "error: missing required entry '${required_entry}' inside ${ipa_path}" >&2
              exit 1
            fi
          done
          echo "Verified Payload/OnDeviceLAS.app structure and required resources inside OnDeviceLAS-unsigned.ipa"

          # 5. Record size and SHA-256
          ipa_bytes="$(stat -f '%z' "${ipa_path}")"
          ipa_sha256="$(shasum -a 256 "${ipa_path}" | awk '{ print $1 }')"
          echo "IPA file: OnDeviceLAS-unsigned.ipa"
          echo "IPA size (bytes): ${ipa_bytes}"
          echo "IPA SHA-256: ${ipa_sha256}"
          ls -lh "${ipa_path}"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### OnDeviceLAS Unsigned IPA Build Summary"
              echo "- **File**: `OnDeviceLAS-unsigned.ipa`"
              echo "- **Size**: `${ipa_bytes}` bytes"
              echo "- **SHA-256**: `${ipa_sha256}`"
              echo "- **Bundle ID**: `com.local.ondevicelas`"
              echo "- **Default API Port**: `11434`"
            } >>"${GITHUB_STEP_SUMMARY}"
          fi
          df -h

      - name: Save IPA metadata log
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          IPA_PATH="${GITHUB_WORKSPACE}/OnDeviceLAS-unsigned.ipa"
          LOG_PATH="${RUNNER_TEMP}/ipa_metadata.txt"
          if [[ ! -f "$IPA_PATH" ]]; then
            echo "Error: IPA not found" >&2
            echo "IPA missing" >"$LOG_PATH"
            exit 0
          fi
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa_tmp"
          PLIST="$RUNNER_TEMP/ipa_tmp/Payload/OnDeviceLAS.app/Info.plist"
          if [[ ! -f "$PLIST" ]]; then
            echo "Error: Info.plist missing" >&2
            echo "Info.plist missing" >"$LOG_PATH"
            exit 0
          fi
          BUNDLE_ID=$(defaults read "$PLIST" CFBundleIdentifier)
          VERSION=$(defaults read "$PLIST" CFBundleShortVersionString)
          BUILD=$(defaults read "$PLIST" CFBundleVersion)
          EXECUTABLE=$(defaults read "$PLIST" CFBundleExecutable)
          EXEC_PATH="$RUNNER_TEMP/ipa_tmp/Payload/OnDeviceLAS.app/$EXECUTABLE"
          if [[ -f "$EXEC_PATH" ]]; then
            SIZE=$(stat -f '%z' "$EXEC_PATH")
          else
            SIZE="missing"
          fi
          {
            echo "Bundle ID: $BUNDLE_ID"
            echo "Version: $VERSION"
            echo "Build: $BUILD"
            echo "Executable: $EXECUTABLE"
            echo "Executable size (bytes): $SIZE"
          } >"$LOG_PATH"
          # cleanup
          rm -rf "$RUNNER_TEMP/ipa_tmp"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: OnDeviceLAS-unsigned.ipa
          path: OnDeviceLAS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Diagnose code signing (non-blocking)
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          APP_BUNDLE="${GITHUB_WORKSPACE}/build/Build/Products/Release-iphoneos/OnDeviceLAS.app"
          if [[ ! -d "$APP_BUNDLE" ]]; then
            echo "ERROR: app bundle missing" >"${RUNNER_TEMP}/codesign_log.txt"
            exit 0
          fi
          DVV_LOG="${RUNNER_TEMP}/codesign_dvv.txt"
          VERIFY_LOG="${RUNNER_TEMP}/codesign_verify.txt"
          LOG_PATH="${RUNNER_TEMP}/codesign_log.txt"
          if codesign -dvv "$APP_BUNDLE" >"$DVV_LOG" 2>&1; then
            DVV_EXIT=0
          else
            DVV_EXIT=$?
          fi
          if codesign --verify --deep --strict "$APP_BUNDLE" >"$VERIFY_LOG" 2>&1; then
            VERIFY_EXIT=0
          else
            VERIFY_EXIT=$?
          fi
          cat "$DVV_LOG" "$VERIFY_LOG" >"$LOG_PATH"
          classify_codesign() {
            local dvv_exit=$1
            local verify_exit=$2
            local log_path=$3
            # Detection patterns (conservative exact line match)
            local unsigned_pat='^code object is not signed$'
            local signed_pat='code object is signed|signed code object'
            # Capture matches (ignore STATUS line which is not yet in the file)
            local has_unsigned=$(grep -Eix "$unsigned_pat" "$log_path" || true)
            local has_signed=$(grep -Ei "$signed_pat" "$log_path" || true)
            # Highest‑priority contradictions
            if [[ -n $has_unsigned && -n $has_signed ]]; then
              echo "STATUS: UNKNOWN" >>"$log_path"
            elif [[ $verify_exit -eq 0 && -n $has_unsigned ]]; then
              echo "STATUS: UNKNOWN" >>"$log_path"
            # VERIFIED
            elif [[ $verify_exit -eq 0 && -z $has_unsigned ]]; then
              echo "STATUS: VERIFIED" >>"$log_path"
            # UNSIGNED
            elif [[ $verify_exit -ne 0 && -n $has_unsigned && -z $has_signed ]]; then
              echo "STATUS: UNSIGNED" >>"$log_path"
            else
              echo "STATUS: UNKNOWN" >>"$log_path"
            fi
          }
          classify_codesign "$DVV_EXIT" "$VERIFY_EXIT" "$LOG_PATH"

      - name: Upload IPA metadata log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ipa-metadata-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ipa_metadata.txt
          if-no-files-found: warn

      - name: Upload codesign diagnostic log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codesign-log-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codesign_log.txt
          if-no-files-found: warn
